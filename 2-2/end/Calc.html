<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>מחשבון</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;700"
          rel="stylesheet" />
    <style>
        body {
            font-family: Assistant, Arial, sans-serif;
        }
    </style>
</head>
<body>
    <script>
        let a = parseInt(prompt("מספר ראשון", 0));
        let b = parseInt(prompt("מספר שני", 0));
        document.write(`<p dir="ltr">${a} + ${b} = ${a + b}</p>`);
    </script>
</body>
</html>
