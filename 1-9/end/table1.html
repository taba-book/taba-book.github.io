<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <title>הספרייה שלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700"
          rel="stylesheet" />
    <style> body { font-family: Assistant, Arial, sans-serif; } </style>
    <style>
        table, th, td {
            border: 1px solid #999;
            border-collapse: collapse;
            text-align: center;
        }
    </style>
    <style>
        td { width: 150px; padding: 15px; }
        tr { height: 50px; }
        table { border-spacing: 10px; }
    </style>
    <style>
        div { width: 100%; }
        table { margin: 0 auto; } /* auto = מרכוז אופקי */
    </style>
</head>
<body>
    <div>
        <table>
            <tr>
                <th>שם משפחה</th>
                <th>שם פרטי</th>
                <th>עיר</th>
            </tr>
            <tr>
                <td>ירקוני</td>
                <td>יעל</td>
                <td>תל אביב</td>
            </tr>
        </table>
    </div>

    <table>
        <tr>
            <td colspan="2">שני תאים לרוחב</td>
        </tr>
        <tr>
            <td rowspan="2">שני תאים לגובה</td>
            <td>תא</td>
        </tr>
        <tr>
            <td>תא</td>
        </tr>
    </table>
</body>
</html>
